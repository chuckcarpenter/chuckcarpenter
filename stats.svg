<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="stats-title">
  <title id="stats-title">By the numbers — a sampling</title>
  <style><![CDATA[
    .display { font-family: "Hoefler Text", "Garamond Premier Pro", "Garamond", "Times New Roman", Georgia, serif; }
    .body    { font-family: "Hoefler Text", "Garamond", Georgia, "Times New Roman", serif; }
    .label   { font-family: "Helvetica Neue", "Inter", Helvetica, Arial, sans-serif; letter-spacing: 0.22em; }

    .ink-1 { fill: #111827; }
    .ink-2 { fill: #374151; }
    .ink-3 { fill: #6B7280; }
    .ink-4 { fill: #9CA3AF; }

    .rule-thick { stroke: #1F2937; }
    .rule-thin  { stroke: #D1D5DB; }

    @media (prefers-color-scheme: dark) {
      .ink-1 { fill: #F9FAFB; }
      .ink-2 { fill: #E5E7EB; }
      .ink-3 { fill: #9CA3AF; }
      .ink-4 { fill: #6B7280; }
      .rule-thick { stroke: #E5E7EB; }
      .rule-thin  { stroke: #4B5563; }
    }
  ]]></style>

  <!-- Top double rule -->
  <line x1="40" y1="14" x2="860" y2="14" class="rule-thick" stroke-width="2" />
  <line x1="40" y1="20" x2="860" y2="20" class="rule-thick" stroke-width="0.5" />

  <!-- Section label -->
  <text x="450" y="46" class="label ink-3" font-size="11" font-weight="700" text-anchor="middle">— BY THE NUMBERS —</text>

  <!-- Hairline -->
  <line x1="40" y1="64" x2="860" y2="64" class="rule-thin" stroke-width="0.5" />

  <!-- Column 1: 13,700 -->
  <text x="142" y="130" class="display ink-1" font-size="46" font-weight="500" text-anchor="middle" letter-spacing="-0.5">13,700</text>
  <text x="142" y="158" class="label ink-3" font-size="9" font-weight="700" text-anchor="middle">STARS</text>
  <text x="142" y="174" class="body  ink-2" font-size="13" font-style="italic" text-anchor="middle">shepherd</text>

  <!-- Vertical separator -->
  <line x1="245" y1="92" x2="245" y2="180" class="rule-thin" stroke-width="0.5" />

  <!-- Column 2: 714 -->
  <text x="347" y="130" class="display ink-1" font-size="46" font-weight="500" text-anchor="middle" letter-spacing="-0.5">714</text>
  <text x="347" y="158" class="label ink-3" font-size="9" font-weight="700" text-anchor="middle">STARS</text>
  <text x="347" y="174" class="body  ink-2" font-size="13" font-style="italic" text-anchor="middle">REM-unit-polyfill</text>

  <!-- Vertical separator -->
  <line x1="450" y1="92" x2="450" y2="180" class="rule-thin" stroke-width="0.5" />

  <!-- Column 3: 36 -->
  <text x="552" y="130" class="display ink-1" font-size="46" font-weight="500" text-anchor="middle" letter-spacing="-0.5">36</text>
  <text x="552" y="158" class="label ink-3" font-size="9" font-weight="700" text-anchor="middle">REPOSITORIES</text>
  <text x="552" y="174" class="body  ink-2" font-size="13" font-style="italic" text-anchor="middle">public</text>

  <!-- Vertical separator -->
  <line x1="655" y1="92" x2="655" y2="180" class="rule-thin" stroke-width="0.5" />

  <!-- Column 4: 15 -->
  <text x="757" y="130" class="display ink-1" font-size="46" font-weight="500" text-anchor="middle" letter-spacing="-0.5">15</text>
  <text x="757" y="158" class="label ink-3" font-size="9" font-weight="700" text-anchor="middle">YEARS</text>
  <text x="757" y="174" class="body  ink-2" font-size="13" font-style="italic" text-anchor="middle">on GitHub</text>

  <!-- Hairline -->
  <line x1="40" y1="200" x2="860" y2="200" class="rule-thin" stroke-width="0.5" />

  <!-- Italic footnote -->
  <text x="450" y="222" class="body ink-4" font-size="12" font-style="italic" text-anchor="middle">A snapshot of small accomplishments, rounded down. Astro contributor. npm publisher.</text>

  <!-- Bottom double rule -->
  <line x1="40" y1="238" x2="860" y2="238" class="rule-thick" stroke-width="0.5" />
  <line x1="40" y1="244" x2="860" y2="244" class="rule-thick" stroke-width="2" />
</svg>
