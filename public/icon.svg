<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Chuck Carpenter monogram — matches the masthead's chromatic glitch (cyan +3,+3 / yellow -2,-2) -->
  <rect width="64" height="64" rx="10" fill="#000033" stroke="#ff00ff" stroke-width="4"/>
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="46" text-anchor="middle">
    <text x="35" y="49" fill="#00ffff">C</text>
    <text x="30" y="44" fill="#ffff00">C</text>
    <text x="32" y="46" fill="#ff00ff">C</text>
  </g>
</svg>
